<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Store & Carteira</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --green: #10b981;
            --text: #f8fafc;
            --subtext: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }
        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
        }
        .balance-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .balance-title {
            font-size: 0.85rem;
            color: var(--subtext);
        }
        .balance-amount {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            margin: 8px 0 16px 0;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-deposit { background-color: var(--green); color: white; }
        .btn-withdraw { background-color: #3b82f6; color: white; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            border: 1px solid #334155;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px 0;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        .close-btn {
            background: transparent;
            color: var(--subtext);
            border: none;
            float: right;
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">LUMINA STORE</div>
    </div>

    <div class="balance-card">
        <div class="balance-title">Saldo Disponível</div>
        <div class="balance-amount" id="saldoDisplay">0.00 MT</div>
        <div class="actions">
            <button class="btn btn-deposit" onclick="abrirModal('recargaModal')">Recarregar</button>
            <button class="btn btn-withdraw" onclick="abrirModal('saqueModal')">Sacar</button>
        </div>
    </div>
</div>

<!-- Modal Recarga -->
<div class="modal" id="recargaModal">
    <div class="modal-content">
        <button class="close-btn" onclick="fecharModal('recargaModal')">&times;</button>
        <h3>Recarregar Carteira</h3>
        <label>Método:</label>
        <select id="metodoRecarga">
            <option value="M-Pesa">M-Pesa</option>
            <option value="e-Mola">e-Mola</option>
        </select>
        <label>Número de Telefone:</label>
        <input type="number" id="numRecarga" placeholder="84/85/86/87...">
        <label>Valor (MT):</label>
        <input type="number" id="valorRecarga" placeholder="ex: 500">
        <button class="btn btn-deposit" style="width: 100%;" onclick="processarRecarga()">Confirmar Recarga</button>
    </div>
</div>

<!-- Modal Saque -->
<div class="modal" id="saqueModal">
    <div class="modal-content">
        <button class="close-btn" onclick="fecharModal('saqueModal')">&times;</button>
        <h3>Solicitar Saque</h3>
        <p style="font-size: 0.8rem; color: #94a3b8;">Taxa de processamento: 5%</p>
        <label>Número de Telefone:</label>
        <input type="number" id="numSaque" placeholder="84/85/86/87...">
        <label>Valor a Sacar (MT):</label>
        <input type="number" id="valorSaque" placeholder="ex: 200">
        <button class="btn btn-withdraw" style="width: 100%;" onclick="processarSaque()">Confirmar Saque</button>
    </div>
</div>

<script>
    const API_URL = 'https://lumina-store-1711.onrender.com';

    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
    function fecharModal(id) { document.getElementById(id).style.display = 'none'; }

    async function processarRecarga() {
        const metodo = document.getElementById('metodoRecarga').value;
        const telefone = document.getElementById('numRecarga').value;
        const valor = document.getElementById('valorRecarga').value;

        if(!telefone || !valor) return alert("Preencha todos os campos!");

        try {
            const res = await fetch(`${API_URL}/api/recarga`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ metodo, telefone, valor })
            });
            const data = await res.json();
            alert(data.mensagem);
            fecharModal('recargaModal');
        } catch(e) {
            alert("Erro ao conectar com o servidor.");
        }
    }

    async function processarSaque() {
        const telefone = document.getElementById('numSaque').value;
        const valor = document.getElementById('valorSaque').value;

        if(!telefone || !valor) return alert("Preencha todos os campos!");

        try {
            const res = await fetch(`${API_URL}/api/saque`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telefone, valor })
            });
            const data = await res.json();
            alert(data.mensagem);
            fecharModal('saqueModal');
        } catch(e) {
            alert("Erro ao conectar com o servidor.");
        }
    }
</script>

</body>
</html>
